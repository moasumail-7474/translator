<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.json">
<title>마주보기 번역기 · Dịch đối diện</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    background: #0f1115;
  }
  #app { display: flex; flex-direction: column; height: 100dvh; transition: transform .3s ease; }
  #app.flipped { transform: rotate(180deg); }

  .half { flex: 1; display: flex; flex-direction: column; min-height: 0; position: relative; }
  .half.vn { transform: rotate(180deg); background: #14212e; }
  .half.ko { background: #1a1a24; }

  .divider {
    height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    gap: 10px; background: #0f1115; border-top: 1px solid #2a2f3a; border-bottom: 1px solid #2a2f3a;
  }
  .divider button {
    background: #232838; color: #9aa4b8; border: none; border-radius: 8px;
    padding: 7px 12px; font-size: 13px; font-weight: 600;
  }
  .divider button:active { background: #2f3648; }

  .msgs {
    flex: 1; overflow-y: auto; padding: 14px 16px;
    display: flex; flex-direction: column; justify-content: flex-end; gap: 10px;
  }
  .bubble { border-radius: 14px; padding: 11px 14px; max-width: 92%; word-break: break-word; }
  .bubble .main { font-size: 22px; line-height: 1.35; font-weight: 600; }
  .bubble .sub { font-size: 13px; margin-top: 5px; opacity: .55; }
  .bubble .speak {
    display: inline-block; margin-top: 8px; font-size: 12px; font-weight: 600;
    background: rgba(255,255,255,.1); border: none; color: inherit;
    border-radius: 7px; padding: 5px 10px;
  }
  .vn .bubble { background: #1e3a52; color: #dbeafe; align-self: flex-start; }
  .vn .bubble.mine { background: #2a4a66; align-self: flex-end; }
  .ko .bubble { background: #2a2a3a; color: #e8e8f0; align-self: flex-start; }
  .ko .bubble.mine { background: #3a3550; align-self: flex-end; }

  .placeholder { color: #4a5164; font-size: 15px; text-align: center; padding: 20px; align-self: center; }

  .inputbar {
    flex-shrink: 0; display: flex; gap: 8px; padding: 10px 12px;
    border-top: 1px solid rgba(255,255,255,.07);
  }
  .inputbar input {
    flex: 1; min-width: 0; font-size: 17px; padding: 12px 14px; border-radius: 12px;
    border: 1px solid #333a4a; background: #0d1017; color: #fff; outline: none;
  }
  .inputbar input:focus { border-color: #4a7fd4; }
  .inputbar button {
    flex-shrink: 0; border: none; border-radius: 12px; padding: 0 18px;
    font-size: 15px; font-weight: 700; color: #fff; background: #3b6fd4;
  }
  .inputbar button:disabled { opacity: .45; }
  .vn .inputbar button { background: #d4763b; }

  .label {
    position: absolute; top: 6px; right: 12px; font-size: 10px;
    letter-spacing: .8px; color: #5a6478; font-weight: 700;
  }

  /* ── 한쪽이 입력 중일 때: 그 쪽만 자판, 반대쪽은 번역된 글만 ── */
  /* 한국어 입력 중 → 베트남어 쪽 입력창 숨김 */
  #app.mode-ko .vn .inputbar { display: none; }
  #app.mode-ko .vn { flex: 1.6; }
  /* 베트남어 입력 중 → 한국어 쪽 입력창 숨김.
     베트남어 쪽은 앱 자판이 들어가야 하므로 화면을 더 크게 준다 */
  #app.mode-vi .ko .inputbar { display: none; }
  #app.mode-vi .vn { flex: 2.7; }
  #app.mode-vi .ko { flex: 1; }

  /* 상대방이 읽는 쪽은 글자를 크게 */
  #app.mode-ko .vn .bubble .main { font-size: 26px; }

  /* 입력창이 숨겨진 쪽에서 "내가 칠 차례" 로 넘겨받는 띠 */
  .takeover {
    display: none; flex-shrink: 0; text-align: center;
    padding: 13px 12px; font-size: 14px; font-weight: 600;
    color: #8fa4bd; background: rgba(255,255,255,.04);
    border-top: 1px solid rgba(255,255,255,.08);
  }
  .takeover:active { background: rgba(255,255,255,.11); }
  #app.mode-vi .ko .takeover { display: block; }
  #app.mode-ko .vn .takeover { display: block; }

  /* ── 앱 안에 내장한 베트남어 자판 ── */
  .vkbd {
    flex-shrink: 0; display: none; padding: 5px 4px 8px;
    background: #0c1620; border-top: 1px solid rgba(255,255,255,.08);
    user-select: none;
  }
  #app.mode-vi .vkbd { display: block; }
  .vkbd .row { display: flex; gap: 4px; margin-bottom: 4px; justify-content: center; }
  .vkbd .k {
    flex: 1; min-width: 0; height: 40px; border-radius: 7px; border: none;
    background: #253546; color: #e8f0f8; font-size: 17px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .vkbd .k:active { background: #3a5570; }
  .vkbd .k.special { background: #1c3d5a; color: #9fd0ff; font-size: 16px; }
  .vkbd .k.tone { background: #4a3520; color: #ffd9a0; font-weight: 700; }
  .vkbd .k.wide { flex: 2.2; }
  .vkbd .k.space { flex: 4.5; }
  .vkbd .k.act { background: #d4763b; color: #fff; font-size: 14px; }
  .vkbd .k.del { background: #52323a; color: #ffc9d2; }
  .vkbd .hint {
    text-align: center; font-size: 10px; color: #4a5a6a; margin: 2px 0 6px;
  }

  /* 내장 자판을 쓰는 동안에는 폰 자판이 뜨지 않게 */
  #vnInput { caret-color: #4a7fd4; }

  /* 입력하는 동안 실시간으로 보여주는 미리보기 */
  .bubble.preview { opacity: .75; border: 1px dashed rgba(255,255,255,.25); }
  .bubble.preview .main { font-style: normal; }
  .bubble.preview .tag {
    font-size: 11px; opacity: .5; font-weight: 700; letter-spacing: .5px; margin-bottom: 4px;
  }

  #phrases {
    position: fixed; inset: 0; background: #0f1115; z-index: 50;
    display: none; flex-direction: column;
  }
  #phrases.open { display: flex; }
  #phrases header {
    padding: 14px 16px; display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid #2a2f3a; color: #e8e8f0; font-weight: 700;
  }
  #phrases header button { background: #232838; color: #9aa4b8; border: none; border-radius: 8px; padding: 8px 14px; font-size: 14px; }
  #phraseList { flex: 1; overflow-y: auto; padding: 10px 12px; }
  .phrase {
    background: #1a1e28; border: 1px solid #262c38; border-radius: 12px;
    padding: 12px 14px; margin-bottom: 8px; color: #e8e8f0;
  }
  .phrase .ko-t { font-size: 16px; font-weight: 600; }
  .phrase .vi-t { font-size: 14px; color: #8fb4e0; margin-top: 3px; }
  .cat { color: #5a6478; font-size: 12px; font-weight: 700; margin: 14px 4px 8px; letter-spacing: .5px; }
</style>
</head>
<body>

<div id="app">
  <!-- 베트남 사람 쪽 (180도 회전) -->
  <div class="half vn">
    <div class="label">TIẾNG VIỆT</div>
    <div class="msgs" id="vnMsgs">
      <div class="placeholder">Hãy nhập tiếng Việt bên dưới ↓</div>
    </div>
    <div class="inputbar">
      <input id="vnInput" type="text" placeholder="Nhập tiếng Việt..." autocomplete="off"
             enterkeyhint="send" inputmode="none" autocapitalize="off" spellcheck="false">
      <button id="vnSend">Gửi</button>
    </div>
    <div class="takeover" id="vnTakeover">✍️ Chạm vào đây để nhập tiếng Việt</div>
    <div class="vkbd" id="vkbd"></div>
  </div>

  <div class="divider">
    <button id="flipBtn">🔄 화면 뒤집기</button>
    <button id="phraseBtn">📖 여행 문장</button>
    <button id="clearBtn">🗑 지우기</button>
  </div>

  <!-- 한국 사람 쪽 -->
  <div class="half ko">
    <div class="msgs" id="koMsgs">
      <div class="placeholder">아래에 한국어로 입력하세요 ↓</div>
    </div>
    <div class="inputbar">
      <input id="koInput" type="text" placeholder="한국어로 입력..." autocomplete="off" enterkeyhint="send">
      <button id="koSend">전송</button>
    </div>
    <div class="takeover" id="koTakeover">✍️ 여기를 눌러 한국어로 입력</div>
    <div class="label">한국어</div>
  </div>
</div>

<div id="phrases">
  <header>
    <span>📖 나트랑 여행 문장</span>
    <button id="phraseClose">닫기</button>
  </header>
  <div id="phraseList"></div>
</div>

<script>
"use strict";

/* ---------- 여행 문장집 (오프라인에서도 동작) ---------- */
const PHRASEBOOK = [
  ["인사", [
    ["안녕하세요", "Xin chào"],
    ["감사합니다", "Cảm ơn"],
    ["죄송합니다", "Xin lỗi"],
    ["안녕히 계세요", "Tạm biệt"],
  ]],
  ["흥정 · 쇼핑", [
    ["얼마예요?", "Bao nhiêu tiền?"],
    ["너무 비싸요", "Đắt quá"],
    ["깎아 주세요", "Giảm giá cho tôi"],
    ["이거 주세요", "Cho tôi cái này"],
    ["카드 되나요?", "Có nhận thẻ không?"],
  ]],
  ["식당", [
    ["메뉴 주세요", "Cho tôi thực đơn"],
    ["맵지 않게 해주세요", "Đừng cay nhé"],
    ["고수 빼주세요", "Không cho rau mùi"],
    ["계산해 주세요", "Tính tiền"],
    ["맛있어요", "Ngon quá"],
  ]],
  ["이동", [
    ["여기로 가주세요", "Cho tôi đến đây"],
    ["공항까지 얼마예요?", "Đến sân bay bao nhiêu tiền?"],
    ["미터기 켜주세요", "Bật đồng hồ đi"],
    ["여기서 세워주세요", "Dừng ở đây"],
  ]],
  ["긴급", [
    ["도와주세요", "Giúp tôi với"],
    ["병원이 어디예요?", "Bệnh viện ở đâu?"],
    ["경찰을 불러주세요", "Gọi cảnh sát giúp tôi"],
    ["몸이 아파요", "Tôi bị đau"],
  ]],
];

/* ---------- 번역 ---------- */
async function translate(text, from, to) {
  const q = encodeURIComponent(text);

  // 1순위: 구글 무료 엔드포인트 (품질 좋음)
  try {
    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${from}&tl=${to}&dt=t&q=${q}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error("google http " + res.status);
    const data = await res.json();
    const out = (data[0] || []).map(seg => seg[0]).join("");
    if (out.trim()) return out;
    throw new Error("google empty");
  } catch (e) {
    console.warn("[translate] google 실패, 대체 시도:", e.message);
  }

  // 2순위: MyMemory
  try {
    const url = `https://api.mymemory.translated.net/get?q=${q}&langpair=${from}|${to}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error("mymemory http " + res.status);
    const data = await res.json();
    const out = data?.responseData?.translatedText;
    if (out && out.trim()) return out;
    throw new Error("mymemory empty");
  } catch (e) {
    console.warn("[translate] mymemory 실패:", e.message);
  }

  return null; // 두 곳 모두 실패
}

/* ---------- 음성 읽기 ---------- */
function speak(text, lang) {
  if (!("speechSynthesis" in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    u.rate = 0.9;
    speechSynthesis.speak(u);
  } catch (e) {
    console.warn("[speak] 실패:", e.message);
  }
}

/* ---------- 화면 그리기 ---------- */
const koMsgs = document.getElementById("koMsgs");
const vnMsgs = document.getElementById("vnMsgs");
let history = [];

// 입력 중인 내용의 실시간 미리보기 (상대방 화면에만 표시)
let preview = null; // { from: "ko"|"vi", translated: string }

function render() {
  koMsgs.innerHTML = "";
  vnMsgs.innerHTML = "";

  if (history.length === 0 && !preview) {
    koMsgs.innerHTML = '<div class="placeholder">아래에 한국어로 입력하세요 ↓</div>';
    vnMsgs.innerHTML = '<div class="placeholder">Hãy nhập tiếng Việt bên dưới ↓</div>';
    return;
  }

  for (const m of history) {
    // 한국어 화면: 한국어를 크게, 베트남어를 작게
    koMsgs.appendChild(bubble(m.ko, m.vi, m.from === "ko", "ko-KR"));
    // 베트남어 화면: 베트남어를 크게, 한국어를 작게
    vnMsgs.appendChild(bubble(m.vi, m.ko, m.from === "vi", "vi-VN"));
  }

  // 미리보기는 "듣는 쪽" 화면에만 붙인다
  if (preview && preview.translated) {
    if (preview.from === "ko") {
      vnMsgs.appendChild(previewBubble(preview.translated, "Đang nhập...", "vi-VN"));
    } else {
      koMsgs.appendChild(previewBubble(preview.translated, "입력 중...", "ko-KR"));
    }
  }

  koMsgs.scrollTop = koMsgs.scrollHeight;
  vnMsgs.scrollTop = vnMsgs.scrollHeight;
}

function previewBubble(text, tag, speakLang) {
  const div = document.createElement("div");
  div.className = "bubble preview";

  const t = document.createElement("div");
  t.className = "tag";
  t.textContent = tag;
  div.appendChild(t);

  const m = document.createElement("div");
  m.className = "main";
  m.textContent = text;
  div.appendChild(m);

  const btn = document.createElement("button");
  btn.className = "speak";
  btn.textContent = "🔊";
  btn.onclick = () => speak(text, speakLang);
  div.appendChild(btn);

  return div;
}

function bubble(main, sub, mine, speakLang) {
  const div = document.createElement("div");
  div.className = "bubble" + (mine ? " mine" : "");

  const m = document.createElement("div");
  m.className = "main";
  m.textContent = main;
  div.appendChild(m);

  if (sub) {
    const s = document.createElement("div");
    s.className = "sub";
    s.textContent = sub;
    div.appendChild(s);
  }

  const btn = document.createElement("button");
  btn.className = "speak";
  btn.textContent = "🔊";
  btn.onclick = () => speak(main, speakLang);
  div.appendChild(btn);

  return div;
}

/* ---------- 전송 처리 ---------- */
async function send(from) {
  const input = document.getElementById(from === "ko" ? "koInput" : "vnInput");
  const btn = document.getElementById(from === "ko" ? "koSend" : "vnSend");
  const text = input.value.trim();
  if (!text) return;

  const to = from === "ko" ? "vi" : "ko";
  input.value = "";
  btn.disabled = true;
  preview = null;
  cancelPreview();

  const entry = from === "ko"
    ? { from, ko: text, vi: "· · ·" }
    : { from, vi: text, ko: "· · ·" };
  history.push(entry);
  render();

  const result = await translate(text, from, to);

  if (result === null) {
    const msg = from === "ko" ? "⚠️ 번역 실패 (인터넷 확인)" : "⚠️ Lỗi dịch (kiểm tra mạng)";
    if (from === "ko") entry.vi = msg; else entry.ko = msg;
  } else {
    if (from === "ko") entry.vi = result; else entry.ko = result;
  }

  btn.disabled = false;
  render();
  save();

  // 상대방 언어를 자동으로 읽어줌
  if (result) speak(result, to === "vi" ? "vi-VN" : "ko-KR");
}

/* ---------- 저장 / 복원 ---------- */
function save() {
  try {
    localStorage.setItem("translator_history", JSON.stringify(history.slice(-40)));
  } catch (e) { /* 저장 실패는 무시 */ }
}
function load() {
  try {
    const raw = localStorage.getItem("translator_history");
    if (raw) history = JSON.parse(raw);
  } catch (e) { history = []; }
}

/* ---------- 문장집 ---------- */
function buildPhrases() {
  const list = document.getElementById("phraseList");
  for (const [cat, items] of PHRASEBOOK) {
    const h = document.createElement("div");
    h.className = "cat";
    h.textContent = cat;
    list.appendChild(h);

    for (const [ko, vi] of items) {
      const p = document.createElement("div");
      p.className = "phrase";
      p.innerHTML = `<div class="ko-t">${ko}</div><div class="vi-t">${vi}</div>`;
      p.onclick = () => {
        history.push({ from: "ko", ko, vi });
        render();
        save();
        speak(vi, "vi-VN");
        document.getElementById("phrases").classList.remove("open");
      };
      list.appendChild(p);
    }
  }
}

/* ---------- 입력 중인 쪽만 자판, 상대는 번역글만 ---------- */
const appEl = document.getElementById("app");
let previewTimer = null;
let previewSeq = 0;      // 늦게 도착한 응답이 최신 결과를 덮어쓰지 않게 하는 순번
let blurTimer = null;

function setMode(from) {
  clearTimeout(blurTimer);
  appEl.classList.remove("mode-ko", "mode-vi");
  if (from) appEl.classList.add(from === "ko" ? "mode-ko" : "mode-vi");

  // 입력하는 사람이 바뀌면 이전 사람의 미리보기는 지운다
  if (preview && preview.from !== from) {
    preview = null;
    cancelPreview();
    render();
  }
}

// 입력창이 숨겨진 쪽에서 "내가 칠 차례"로 넘겨받기
function takeOver(from) {
  clearTimeout(blurTimer);
  const input = document.getElementById(from === "ko" ? "koInput" : "vnInput");
  setMode(from);
  input.focus();
}

function cancelPreview() {
  clearTimeout(previewTimer);
  previewSeq++;
}

// 입력이 멈추면 0.6초 뒤에 번역해서 상대 화면에 미리 보여준다
function schedulePreview(from) {
  cancelPreview();
  const input = document.getElementById(from === "ko" ? "koInput" : "vnInput");
  const text = input.value.trim();

  if (!text) {
    preview = null;
    render();
    return;
  }

  const seq = previewSeq;
  previewTimer = setTimeout(async () => {
    const to = from === "ko" ? "vi" : "ko";
    const result = await translate(text, from, to);
    if (seq !== previewSeq) return;        // 그 사이 새로 입력됨 → 버림
    if (result) {
      preview = { from, translated: result };
      render();
    }
  }, 600);
}

for (const from of ["ko", "vi"]) {
  const input = document.getElementById(from === "ko" ? "koInput" : "vnInput");

  input.addEventListener("focus", () => setMode(from));
  input.addEventListener("input", () => schedulePreview(from));

  input.addEventListener("blur", () => {
    // 전송 버튼을 누르는 순간에도 blur가 나므로 잠깐 기다렸다 되돌린다
    blurTimer = setTimeout(() => {
      setMode(null);
      preview = null;
      cancelPreview();
      render();
    }, 250);
  });
}

/* ==========================================================
   베트남어 내장 자판 (Telex 입력 방식)
   폰 자판은 화면 아래쪽에만 나오기 때문에, 마주 앉은 사람을 위해
   앱 안에 자판을 직접 그려서 그 사람 쪽(화면 위쪽)에 붙인다.
   ========================================================== */

// 성조 표: [기본, 사끄(´), 후옌(`), 호이(̉ ), 응아(~), 낭(.)]
const TONE_TABLE = {
  a: "aáàảãạ", "ă": "ăắằẳẵặ", "â": "âấầẩẫậ",
  e: "eéèẻẽẹ", "ê": "êếềểễệ",
  i: "iíìỉĩị",
  o: "oóòỏõọ", "ô": "ôốồổỗộ", "ơ": "ơớờởỡợ",
  u: "uúùủũụ", "ư": "ưứừửữự",
  y: "yýỳỷỹỵ",
};

// 성조 붙은 글자 → { 기본글자, 성조번호 } 로 되돌리는 표
const CHAR_INFO = {};
for (const [base, forms] of Object.entries(TONE_TABLE)) {
  [...forms].forEach((ch, i) => { CHAR_INFO[ch] = { base, tone: i }; });
}

const BASE_VOWELS = "aăâeêioôơuưy";
const TELEX_TONE_KEYS = { s: 1, f: 2, r: 3, x: 4, j: 5 };
const TELEX_LETTER = {
  aa: "â", aw: "ă", ee: "ê", oo: "ô", ow: "ơ", uw: "ư", dd: "đ",
};

function stripTone(word) {
  return [...word].map(ch => (CHAR_INFO[ch] ? CHAR_INFO[ch].base : ch)).join("");
}
function currentTone(word) {
  for (const ch of word) if (CHAR_INFO[ch] && CHAR_INFO[ch].tone > 0) return CHAR_INFO[ch].tone;
  return 0;
}

// 성조를 어느 모음에 붙일지 결정
function toneTargetIndex(bare) {
  const idx = [];
  [...bare].forEach((ch, i) => { if (BASE_VOWELS.includes(ch)) idx.push(i); });
  if (idx.length === 0) return -1;

  // qu-, gi- 의 u/i 는 모음이 아니라 받침소리라 건너뛴다
  if (idx.length > 1) {
    const first = idx[0];
    if ((bare[first] === "u" && bare[first - 1] === "q") ||
        (bare[first] === "i" && bare[first - 1] === "g")) {
      idx.shift();
    }
  }
  if (idx.length === 1) return idx[0];

  // ă â ê ô ơ ư 가 있으면 거기에 붙인다.
  // ươi / ươu 처럼 두 개가 붙어 있으면 뒤쪽이 정답 (người, rượu)
  for (let k = idx.length - 1; k >= 0; k--) {
    if ("ăâêôơư".includes(bare[idx[k]])) return idx[k];
  }

  // 마지막이 자음으로 끝나면 마지막 모음, 모음으로 끝나면 첫 모음
  const lastCh = bare[bare.length - 1];
  return BASE_VOWELS.includes(lastCh) ? idx[0] : idx[idx.length - 1];
}

function applyTone(word, tone) {
  const bare = stripTone(word);
  const already = currentTone(word);
  const target = toneTargetIndex(bare);
  if (target === -1) return null;

  const finalTone = (already === tone) ? 0 : tone; // 같은 성조 또 누르면 해제
  const ch = bare[target];
  const forms = TONE_TABLE[ch];
  if (!forms) return null;

  return bare.slice(0, target) + forms[finalTone] + bare.slice(target + 1);
}

function hasVowel(word) {
  return [...word].some(ch => BASE_VOWELS.includes(CHAR_INFO[ch] ? CHAR_INFO[ch].base : ch));
}

// 마지막 낱말만 떼어내서 처리 후 다시 붙인다
function editLastWord(value, fn) {
  const sp = value.lastIndexOf(" ");
  const head = sp === -1 ? "" : value.slice(0, sp + 1);
  const word = sp === -1 ? value : value.slice(sp + 1);
  const out = fn(word);
  return out === null ? null : head + out;
}

function vkbdType(ch) {
  const input = document.getElementById("vnInput");
  const value = input.value;

  // 1) 성조 글자(s f r x j)는 낱말에 모음이 있을 때만 성조로 동작
  if (TELEX_TONE_KEYS[ch]) {
    const toned = editLastWord(value, w => (hasVowel(w) ? applyTone(w, TELEX_TONE_KEYS[ch]) : null));
    if (toned !== null) { setVnValue(toned); return; }
  }

  // 2) 겹쳐치기 변환 (aa→â, ow→ơ, dd→đ ...)
  const combined = editLastWord(value, w => {
    if (!w) return null;
    const prev = w[w.length - 1];
    const info = CHAR_INFO[prev];
    const prevBase = info ? info.base : prev;
    const key = prevBase + ch;
    if (TELEX_LETTER[key]) {
      // 원래 성조는 유지한 채 글자만 바꾼다
      const tone = info ? info.tone : 0;
      const newBase = TELEX_LETTER[key];
      const forms = TONE_TABLE[newBase];
      const newCh = forms ? forms[tone] : newBase;
      return w.slice(0, -1) + newCh;
    }
    return null;
  });
  if (combined !== null) { setVnValue(combined); return; }

  // 3) 베트남어에는 w 가 없다 → 홀로 눌렀으면 ư 를 원한 것
  if (ch === "w") { setVnValue(value + "ư"); return; }

  setVnValue(value + ch);
}

function setVnValue(v) {
  const input = document.getElementById("vnInput");
  input.value = v;
  schedulePreview("vi");
}

const VKBD_ROWS = [
  { keys: "1234567890".split(""), cls: "" },
  { keys: "qwertyuiop".split(""), cls: "" },
  { keys: "asdfghjkl".split(""), cls: "" },
  { keys: "zxcvbnm".split(""), cls: "", extra: "del" },
  { keys: ["ă", "â", "đ", "ê", "ô", "ơ", "ư"], cls: "special" },
];
const TONE_KEYS = [["á", 1], ["à", 2], ["ả", 3], ["ã", 4], ["ạ", 5]];
const PUNCT_KEYS = [",", ".", "?", "!"];

function buildVkbd() {
  const kbd = document.getElementById("vkbd");
  kbd.innerHTML = "";

  const hint = document.createElement("div");
  hint.className = "hint";
  hint.textContent = "Telex: aa→â  aw→ă  ow→ơ  uw→ư  dd→đ  ·  s f r x j = dấu";
  kbd.appendChild(hint);

  for (const row of VKBD_ROWS) {
    const r = document.createElement("div");
    r.className = "row";
    for (const k of row.keys) {
      r.appendChild(mkKey(k, "k " + row.cls, () => vkbdType(k)));
    }
    if (row.extra === "del") {
      r.appendChild(mkKey("⌫", "k del wide", () => {
        const input = document.getElementById("vnInput");
        setVnValue(input.value.slice(0, -1));
      }));
    }
    kbd.appendChild(r);
  }

  // 성조 + 문장부호
  const toneRow = document.createElement("div");
  toneRow.className = "row";
  for (const [label, tone] of TONE_KEYS) {
    toneRow.appendChild(mkKey(label, "k tone", () => {
      const input = document.getElementById("vnInput");
      const out = editLastWord(input.value, w => (hasVowel(w) ? applyTone(w, tone) : null));
      if (out !== null) setVnValue(out);
    }));
  }
  for (const p of PUNCT_KEYS) {
    toneRow.appendChild(mkKey(p, "k", () => {
      const input = document.getElementById("vnInput");
      setVnValue(input.value + p);
    }));
  }
  kbd.appendChild(toneRow);

  // 스페이스 + 전송
  const last = document.createElement("div");
  last.className = "row";
  last.appendChild(mkKey("space", "k space", () => {
    const input = document.getElementById("vnInput");
    setVnValue(input.value + " ");
  }));
  last.appendChild(mkKey("Gửi", "k act wide", () => send("vi")));
  kbd.appendChild(last);
}

function mkKey(label, cls, onTap) {
  const b = document.createElement("button");
  b.className = cls;
  b.textContent = label;
  b.type = "button";
  // mousedown/touchstart 로 처리해서 입력창 포커스가 풀리지 않게 한다
  b.addEventListener("pointerdown", e => {
    e.preventDefault();
    clearTimeout(blurTimer);
    onTap();
  });
  return b;
}

/* ---------- 넘겨받기 띠 ---------- */
for (const from of ["ko", "vi"]) {
  const el = document.getElementById(from === "ko" ? "koTakeover" : "vnTakeover");
  el.addEventListener("pointerdown", e => {
    e.preventDefault();
    takeOver(from);
  });
}

/* ---------- 이벤트 연결 ---------- */
document.getElementById("koSend").onclick = () => send("ko");
document.getElementById("vnSend").onclick = () => send("vi");
document.getElementById("koInput").addEventListener("keydown", e => { if (e.key === "Enter") send("ko"); });
document.getElementById("vnInput").addEventListener("keydown", e => { if (e.key === "Enter") send("vi"); });

document.getElementById("flipBtn").onclick = () => {
  document.getElementById("app").classList.toggle("flipped");
};
document.getElementById("phraseBtn").onclick = () => {
  document.getElementById("phrases").classList.add("open");
};
document.getElementById("phraseClose").onclick = () => {
  document.getElementById("phrases").classList.remove("open");
};
document.getElementById("clearBtn").onclick = () => {
  history = [];
  render();
  save();
};

/* ---------- 대화 중 화면이 꺼지지 않게 ---------- */
let wakeLock = null;
async function keepScreenOn() {
  if (!("wakeLock" in navigator)) return;
  try {
    wakeLock = await navigator.wakeLock.request("screen");
  } catch (e) {
    console.warn("[wakeLock] 실패:", e.message);
  }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") keepScreenOn();
});
// 첫 터치 이후에 요청해야 브라우저가 허용해준다
document.addEventListener("pointerdown", keepScreenOn, { once: true });

/* ---------- 인터넷 없어도 앱이 열리도록 저장 ---------- */
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(e => {
    console.warn("[sw] 등록 실패:", e.message);
  });
}

load();
buildPhrases();
buildVkbd();
render();
</script>
